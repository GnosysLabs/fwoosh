name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fwoosh-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: fwoosh-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run version:check -- ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libglib2.0-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Check app version consistency
        run: npm run version:check

      - name: Build frontend
        if: runner.os == 'macOS'
        run: npm run build

      - name: Build macOS app and installers
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app dmg --ci
        env:
          CARGO_NET_OFFLINE: "false"

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -type d -name '*.app' -prune -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Expected a macOS app bundle to verify."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run build:windows

      - name: Package Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $installers = Get-ChildItem -Path $bundleRoot -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Extension -eq '.msi' -or $_.Name -like '*-setup.exe' }
          if ($installers.Count -ne 2) {
            throw "Expected one MSI and one NSIS installer, found $($installers.Count)."
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination dist
          }

          $checksums = foreach ($installer in Get-ChildItem dist -File) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($installer.Name)"
          }
          $checksums | Set-Content -Path dist/fwoosh-windows.sha256 -Encoding ascii

      - name: Package macOS bundles
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_root/macos" -type d -name '*.app' -prune -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -type f -name '*.dmg' -print -quit)"
          if [ -z "$app_path" ] || [ -z "$dmg_path" ]; then
            echo "Expected both a macOS app bundle and DMG installer."
            exit 1
          fi

          mkdir -p dist
          cp "$dmg_path" dist/
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/${{ matrix.artifact }}.app.zip"

      - name: Generate macOS SHA-256 checksums
        if: runner.os == 'macOS'
        shell: bash
        run: shasum -a 256 dist/*.dmg dist/*.app.zip > "dist/${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
