[package]
name = "clipvault"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- crypto ---
# rand 0.9 + rand_core 0.9 to match hpke 0.13's expected rand_core.
rand = "0.9"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20poly1305 = "0.11.0"
hpke = { version = "0.13.0", features = ["std", "x25519"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.11.0"
uuid = { version = "1.23.4", features = ["v4"] }
base64 = { version = "0.22.1", features = ["std"] }
bytes = { version = "1.12.0", features = ["serde"] }
hex = "0.4.3"
keyring = "4.1.2"
redb = "4.1.0"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
# Use native-tls (Windows SChannel / macOS SecureTransport): uses the OS TLS
# stack with NO C compilation. rustls's providers (ring, aws-lc-rs) both need a
# C compile, which fails on this machine's incomplete VS C++ install.
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
futures-util = "0.3.32"

[patch.crates-io]
# Replace tauri-winres with a no-op so the build does not require the MSVC
# C++ headers (vcruntime.h/excpt.h), which are missing on this VS 2026
# install. The real crate is pulled in only to embed a Windows icon/version
# resource — cosmetic only. Remove this patch on a machine with a complete
# VS C++ workload to restore real resource embedding.
tauri-winres = { path = "patches/tauri-winres-noop" }

[dev-dependencies]
tempfile = "3.27.0"

