[package]
name = "fwoosh"
version = "0.1.0"
description = "Fwoosh encrypted clipboard sync"
authors = ["Fwoosh contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fwoosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- crypto ---
# rand 0.9 + rand_core 0.9 to match hpke 0.13's expected rand_core.
rand = "0.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20poly1305 = "0.11.0"
hpke = { version = "0.13.0", features = ["std", "x25519"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.11.0"
base64 = { version = "0.22.1", features = ["std"] }
bytes = { version = "1.12.0", features = ["serde"] }
hex = "0.4.3"
keyring = "4.1.2"
keyring-core = "1.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13.4", features = ["json"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
futures-util = "0.3.32"
hmac = "0.13.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
webrtc = "0.17.1"
whoami = "2.1.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
