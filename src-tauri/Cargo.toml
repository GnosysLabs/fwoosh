[package]
name = "fwoosh"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fwoosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- crypto ---
# rand 0.9 + rand_core 0.9 to match hpke 0.13's expected rand_core.
rand = "0.9"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20poly1305 = "0.11.0"
hpke = { version = "0.13.0", features = ["std", "x25519"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.11.0"
uuid = { version = "1.23.4", features = ["v4"] }
base64 = { version = "0.22.1", features = ["std"] }
bytes = { version = "1.12.0", features = ["serde"] }
hex = "0.4.3"
keyring = "4.1.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13.4", features = ["json"] }
futures-util = "0.3.32"
hmac = "0.13.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"

