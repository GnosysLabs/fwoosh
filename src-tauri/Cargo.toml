[package]
name = "fwoosh"
version = "0.1.0"
description = "Fwoosh encrypted clipboard sync"
authors = ["Fwoosh contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fwoosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- crypto ---
# rand 0.9 + rand_core 0.9 to match hpke 0.13's expected rand_core.
rand = "0.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
chacha20poly1305 = "0.11.0"
hpke = { version = "0.13.0", features = ["std", "x25519"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.11.0"
base64 = { version = "0.22.1", features = ["std"] }
bytes = { version = "1.12.0", features = ["serde"] }
hex = "0.4.3"
keyring-core = "1.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
flate2 = "1.1.9"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
futures-util = "0.3.32"
hmac = "0.13.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2"
webrtc = "0.17.1"
whoami = "2.1.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.21"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

# Temporary source-compatible security patch for RUSTSEC-2026-0194 and RUSTSEC-2026-0195.
# Remove once wayland-scanner publishes a crates.io release containing this fix.
# Tracking: https://github.com/GnosysLabs/fwoosh/issues/6
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }
